[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datatidy"
version = "0.1.0"
description = "Quick, dependable cleaning for messy CSV/Excel data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "openpyxl>=3.1"]
keywords = ["data cleaning", "pandas", "csv", "excel", "analytics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
datatidy = "datatidy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
